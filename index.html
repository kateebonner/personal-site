<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Physicist building the software that steers qubits. Quantum optimal control at Harmoniqs; M.S. in Quantum Science & Technology at Columbia.">
  <link rel="icon" href="/assets/favicon.svg?v=3" type="image/svg+xml">
  <meta property="og:title" content="Kate Bonner">
  <meta property="og:description" content="Physicist building the software that steers qubits.">
  <meta property="og:url" content="https://katebonner.ai/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://katebonner.ai/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://katebonner.ai/assets/og.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="paper" id="paper" aria-hidden="true"></div>
  <header class="topbar">
    <a class="topbar__mark" href="/" aria-current="page">Kate Bonner</a>
  </header>

  <main class="sheet">
    <section class="band band--figure" aria-label="Figure">
      <figure class="state" id="state">
        <img class="wp-frame" src="/assets/wavepacket-frame.svg" width="1200" height="560" alt="A pencil sketch of a free Gaussian wavepacket: a helix along x with the real and imaginary parts of psi as the two transverse axes.">
        <div class="wp-mount" id="wp-mount" aria-hidden="true"></div>
      </figure>
    </section>
    <section class="band band--story">
      <div class="story">
        <h1>Lorem ipsum dolor sit amet consectetur.</h1>
        <p class="sub">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation.</p>
      </div>
      <nav class="tiles" aria-label="Sections">
        <a class="tile" href="/projects.html">Projects</a>
        <a class="tile" href="/notes/">Notes</a>
        <a class="tile" href="/contact.html">Contact</a>
      </nav>
    </section>
  </main>

  <script type="module" src="/js/paper.js"></script>
  <script type="module" src="/js/sequence.js"></script>
  <script type="module">
    const start = () => import('/js/sequence.js')
      .then(({ clock }) => import('/js/wavepacket.js').then((m) => m.mount(
        document.getElementById('state'), document.getElementById('wp-mount'), clock)))
      .catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 1500 }); else setTimeout(start, 0);
  </script>
</body>
</html>
